<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6A817" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2D6A4F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="conduitGrad2" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2D6A4F" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#E6A817" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- ===== LEFT: Scattered data nodes ===== -->
  <circle cx="45" cy="120" r="8" fill="#E6A817"/>
  <circle cx="80" cy="180" r="4" fill="#2D6A4F"/>
  <circle cx="30" cy="220" r="12" fill="#2D6A4F"/>
  <circle cx="100" cy="260" r="5" fill="#E6A817"/>
  <circle cx="55" cy="310" r="9" fill="#2D6A4F"/>
  <circle cx="120" cy="340" r="6" fill="#E6A817"/>
  <circle cx="35" cy="380" r="7" fill="#2D6A4F"/>
  <circle cx="90" cy="130" r="3" fill="#2D6A4F"/>
  <circle cx="15" cy="160" r="5" fill="#E6A817"/>
  <circle cx="70" cy="420" r="10" fill="#2D6A4F"/>
  <circle cx="110" cy="80" r="4" fill="#E6A817"/>
  <circle cx="20" cy="60" r="6" fill="#2D6A4F"/>

  <!-- Data node connectors (small lines between nearby nodes) -->
  <line x1="45" y1="120" x2="80" y2="180" stroke="#2D6A4F" stroke-width="0.8" stroke-dasharray="4 4"/>
  <line x1="30" y1="220" x2="100" y2="260" stroke="#E6A817" stroke-width="0.6" stroke-dasharray="3 5"/>
  <line x1="55" y1="310" x2="35" y2="380" stroke="#2D6A4F" stroke-width="0.7" stroke-dasharray="3 4"/>
  <line x1="80" y1="180" x2="30" y2="220" stroke="#2D6A4F" stroke-width="0.5" stroke-dasharray="2 6"/>

  <!-- ===== MIDDLE: Conduit flowing paths ===== -->
  <!-- Main upper conduit -->
  <path d="M130,200 C280,120 400,60 550,150 C620,190 660,210 700,200" stroke="url(#conduitGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle conduit -->
  <path d="M120,280 C300,380 450,400 580,320 C650,280 680,260 720,270" stroke="url(#conduitGrad2)" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower conduit -->
  <path d="M100,360 C250,300 400,340 530,380 C600,400 650,380 710,350" stroke="url(#conduitGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Branch lines -->
  <path d="M180,230 C200,230 220,240 240,250" stroke="#2D6A4F" stroke-width="1" stroke-linecap="round"/>
  <path d="M160,330 C200,310 240,300 280,310" stroke="#E6A817" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M350,220 C370,200 390,185 410,190" stroke="#2D6A4F" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Flowing particles along conduits -->
  <circle cx="200" cy="192" r="3.5" fill="#E6A817"/>
  <circle cx="320" cy="170" r="2.5" fill="#E6A817"/>
  <circle cx="180" cy="288" r="3" fill="#2D6A4F"/>
  <circle cx="420" cy="340" r="2" fill="#E6A817"/>
  <circle cx="500" cy="360" r="2.5" fill="#E6A817"/>
  <circle cx="600" cy="350" r="3" fill="#2D6A4F"/>
  <circle cx="260" cy="175" r="2" fill="#2D6A4F"/>
  <circle cx="510" cy="200" r="2.5" fill="#E6A817"/>
  <circle cx="170" cy="345" r="2.5" fill="#2D6A4F"/>
  <circle cx="350" cy="310" r="2" fill="#E6A817"/>

  <!-- ===== RIGHT: People silhouettes ===== -->
  <!-- Person 1 (tallest, center) -->
  <g transform="translate(680, 195)">
    <circle cx="0" cy="-20" r="9" fill="#2D6A4F"/>
    <path d="M-8,0 L-14,25 L-5,25 L0,8 L5,25 L14,25 L8,0 Z" fill="#2D6A4F"/>
  </g>
  <!-- Person 2 -->
  <g transform="translate(715, 200)">
    <circle cx="0" cy="-18" r="8" fill="#2D6A4F"/>
    <path d="M-7,0 L-12,22 L-4,22 L0,7 L4,22 L12,22 L7,0 Z" fill="#2D6A4F"/>
  </g>
  <!-- Person 3 (shorter, child/youth) -->
  <g transform="translate(650, 215)">
    <circle cx="0" cy="-16" r="7" fill="#E6A817"/>
    <path d="M-6,0 L-10,18 L-3,18 L0,5 L3,18 L10,18 L6,0 Z" fill="#E6A817"/>
  </g>
  <!-- Person 4 -->
  <g transform="translate(745, 210)">
    <circle cx="0" cy="-17" r="7.5" fill="#2D6A4F"/>
    <path d="M-7,0 L-11,20 L-4,20 L0,6 L4,20 L11,20 L7,0 Z" fill="#2D6A4F"/>
  </g>
  <!-- Person 5 -->
  <g transform="translate(620, 220)">
    <circle cx="0" cy="-15" r="7" fill="#2D6A4F"/>
    <path d="M-6,0 L-10,17 L-3,17 L0,4 L3,17 L10,17 L6,0 Z" fill="#2D6A4F"/>
  </g>

  <!-- Community connector lines between people -->
  <line x1="668" y1="195" x2="696" y2="197" stroke="#E6A817" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="697" y1="198" x2="730" y2="205" stroke="#E6A817" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="638" y1="200" x2="666" y2="198" stroke="#E6A817" stroke-width="0.6" stroke-dasharray="2 4"/>
  <line x1="731" y1="208" x2="758" y2="212" stroke="#E6A817" stroke-width="0.7" stroke-dasharray="3 3"/>

  <!-- Data arriving at community (small dots near people) -->
  <circle cx="660" cy="205" r="2.5" fill="#E6A817"/>
  <circle cx="700" cy="190" r="2" fill="#E6A817"/>
  <circle cx="735" cy="210" r="2.5" fill="#E6A817"/>
  <circle cx="640" cy="218" r="2" fill="#2D6A4F"/>

  <!-- Faint Taara diamond watermark center -->
  <g transform="translate(450, 210) scale(0.5)" opacity="0.3">
    <polygon points="84.17,42.78 84.17,86.92 54.59,54.52 54.59,29.57 29.03,29.57 0,0 43.3,0" fill="#2D6A4F"/>
    <polygon points="114.94,29.57 84.17,29.57 84.17,0" fill="#E6A817"/>
  </g>
</svg>
